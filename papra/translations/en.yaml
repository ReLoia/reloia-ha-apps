configuration:
  base_url:
    name: Base URL
    description: Exact address you use in the browser (e.g. http://192.168.1.10:1221)
  auth_secret:
    name: Auth secret
    description: Leave empty to auto-generate and keep one.
  smtp_enabled:
    name: Enable email (SMTP)
    description: Needed for invitations and password resets.
  smtp_host:
    name: SMTP host
  smtp_port:
    name: SMTP port
    description: 465 for implicit TLS, 587 for STARTTLS.
  smtp_secure:
    name: Use implicit TLS
    description: Usually on for port 465, off for 587.
  smtp_user:
    name: SMTP username
  smtp_password:
    name: SMTP password
    description: For Gmail, use an app password, not your account password.
  smtp_from:
    name: From address
  registration_enabled:
    name: Allow public registration
    description: Turn off after creating your account. Invite others from Papra's Members page.
  ocr_languages:
    name: OCR languages
    description: Tesseract codes, comma-separated (e.g. ita,eng)
  env_vars:
    name: Extra environment variables
    description: Any other Papra setting, as name/value pairs.

